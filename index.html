<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b7a75" />
    <meta name="description" content="HydroCheck PH Free V3, an offline hydroponics monitoring PWA." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>HydroCheck PH Free V3</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Free V3 / Offline</p>
          <h1>HydroCheck PH</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="install-button" type="button" title="Install app" hidden>Install</button>
          <button class="icon-button" data-action="seed-demo" type="button" title="Load sample farm data">Demo</button>
        </div>
      </header>

      <nav class="nav" id="nav" aria-label="Main sections"></nav>

      <main id="app" class="app" aria-live="polite"></main>
    </div>

    <template id="toast-template">
      <div class="toast" role="status"></div>
    </template>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
